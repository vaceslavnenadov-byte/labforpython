<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Такси{% endblock %} — Такси «Вариант 10»</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav>
  <a class="brand" href="{{ url_for('web.index') }}">🚕 Такси</a>
  <a href="{{ url_for('web.trip_list') }}">Поездки</a>
  <a href="{{ url_for('web.trip_create') }}">Новая поездка</a>
  <a href="{{ url_for('web.drivers') }}">Водители</a>
  <a href="{{ url_for('web.clients') }}">Клиенты</a>
  <a href="{{ url_for('api.list_trips') }}">API</a>
</nav>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
