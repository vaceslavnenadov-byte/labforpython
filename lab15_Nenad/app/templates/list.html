{% extends "base.html" %}
{% block title %}Поездки{% endblock %}
{% block content %}
<h1>Поездки <small>({{ total }})</small></h1>
<form class="filters" method="get">
  <input name="q" placeholder="Адрес, клиент или водитель" value="{{ args.get('q', '') }}">
  <select name="status">
    <option value="">Любой статус</option>
    {% for s in TripStatus %}<option value="{{ s.value }}" {% if args.get('status') == s.value %}selected{% endif %}>{{ s.title }}</option>{% endfor %}
  </select>
  <select name="car_class">
    <option value="">Любой класс</option>
    {% for c in CarClass %}<option value="{{ c.value }}" {% if args.get('car_class') == c.value %}selected{% endif %}>{{ c.title }}</option>{% endfor %}
  </select>
  <select name="driver_id">
    <option value="">Любой водитель</option>
    {% for d in drivers %}<option value="{{ d.id }}" {% if args.get('driver_id') == d.id|string %}selected{% endif %}>{{ d.full_name }}</option>{% endfor %}
  </select>
  <select name="sort">
    <option value="date" {% if args.get('sort') == 'date' %}selected{% endif %}>по дате</option>
    <option value="cost" {% if args.get('sort') == 'cost' %}selected{% endif %}>по стоимости</option>
    <option value="distance" {% if args.get('sort') == 'distance' %}selected{% endif %}>по расстоянию</option>
  </select>
  <select name="order">
    <option value="desc" {% if args.get('order') != 'asc' %}selected{% endif %}>убывание</option>
    <option value="asc" {% if args.get('order') == 'asc' %}selected{% endif %}>возрастание</option>
  </select>
  <button>Применить</button>
  <a href="{{ url_for('web.trip_list') }}">Сбросить</a>
</form>
{% include "_trips_table.html" with context %}
<div class="pagination">
  {% for p in range(1, pages + 1) %}
    {% if p == page %}<b>{{ p }}</b>{% else %}<a href="{{ url_for('web.trip_list', page=p, **base_args) }}">{{ p }}</a>{% endif %}
  {% endfor %}
</div>
<p><a class="button" href="{{ url_for('web.trip_create') }}">+ Новая поездка</a></p>
{% endblock %}
