# Запуск: cp .env.example .env && docker compose up --build
# API: http://localhost:8000/docs   RabbitMQ: http://localhost:15672
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
  JWT_SECRET: ${JWT_SECRET}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
  CACHE_TTL: ${CACHE_TTL:-60}
  ADMIN_EMAIL: ${ADMIN_EMAIL}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  APP_ENV: production

services:
  api:
    build: .
    ports: ["8000:8000"]
    environment: *app-env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "src.app.worker"]
    environment: *app-env
    healthcheck: {disable: true}
    depends_on:
      db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports: ["15672:15672"]
    volumes: [rabbitdata:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

volumes:
  pgdata:
  redisdata:
  rabbitdata:
