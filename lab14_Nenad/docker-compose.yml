services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://railway:railway@postgres:5432/railway
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-docker-compose-demo-secret-change-me-32b}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: railway
      POSTGRES_PASSWORD: railway
      POSTGRES_DB: railway
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railway"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
volumes:
  pg_data:
