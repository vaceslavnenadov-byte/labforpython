name: lab21 CI (Taxi final project)

on:
  push:
    paths: ["lab21_Nenad/**", ".github/workflows/lab21-ci.yml"]
  pull_request:
    paths: ["lab21_Nenad/**", ".github/workflows/lab21-ci.yml"]

defaults:
  run:
    working-directory: lab21_Nenad

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taxi
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci-only-password' }}
          POSTGRES_DB: taxi_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taxi" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab21_Nenad/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests on SQLite (unit + API)
        run: pytest -q

      - name: Tests on PostgreSQL + coverage (incl. concurrency test)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://taxi:${{ secrets.CI_DB_PASSWORD || 'ci-only-password' }}@localhost:5432/taxi_ci
        run: pytest -v --cov=src --cov-report=term-missing --cov-fail-under=80

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t taxi-final:${{ github.sha }} .
      - name: "Smoke test (compose — api, db, redis, rabbitmq)"
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180 api
          curl -fs localhost:8000/health
          docker compose ps
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Shutdown
        if: always()
        run: docker compose down -v
