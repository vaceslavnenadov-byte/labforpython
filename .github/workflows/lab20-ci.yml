name: lab20 CI (Taxi API)

on:
  push:
    paths: ["lab20_Nenad/**", ".github/workflows/lab20-ci.yml"]
  pull_request:
    paths: ["lab20_Nenad/**", ".github/workflows/lab20-ci.yml"]

defaults:
  run:
    working-directory: lab20_Nenad

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taxi
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci-only-password' }}
          POSTGRES_DB: taxi_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taxi" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab20_Nenad/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests + coverage (unit + integration with PostgreSQL/Redis)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://taxi:${{ secrets.CI_DB_PASSWORD || 'ci-only-password' }}@localhost:5432/taxi_ci
          TEST_REDIS_URL: redis://localhost:6379/0
        run: pytest -v --cov=src --cov-report=term-missing --cov-fail-under=70

  docker:
    needs: test          # образ собирается только если линтер и тесты прошли
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t taxi-api:${{ github.sha }} lab20_Nenad
      - name: Smoke test container (health check)
        run: |
          docker network create taxi
          docker run -d --name db --network taxi -e POSTGRES_USER=taxi -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=taxi postgres:16
          for i in $(seq 1 30); do docker exec db pg_isready -U taxi && break; sleep 2; done
          docker run -d --name app --network taxi -p 8000:8000 \
            -e DATABASE_HOST=db -e DATABASE_PASSWORD=smoke taxi-api:${{ github.sha }}
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs localhost:8000/health
          docker logs app
